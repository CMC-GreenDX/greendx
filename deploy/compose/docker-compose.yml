# EcoTrace core services for Docker Compose.
# Run from the repository root with `make up` (see Makefile), which passes --env-file .env.
# Every image is pinned to an exact version; see docs/licenses.md.

name: ecotrace

x-core: &core
  profiles: [core, app, full]
  restart: unless-stopped
  networks: [core]

services:
  postgres:
    <<: *core
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecotrace
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecotrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies core/data/sql/core.sql (tenant registry, service roles, row-level security), then exits.
  db-migrate:
    <<: *core
    image: postgres:18.6
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: ecotrace
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INTAKE_DB_PASSWORD: ${INTAKE_DB_PASSWORD}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      TRILLIAN_DB_PASSWORD: ${TRILLIAN_DB_PASSWORD}
      PURCHASE_DB_PASSWORD: ${PURCHASE_DB_PASSWORD}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD}
    command: ["sh", "/scripts/migrate.sh"]
    volumes:
      - ../../core/data/sql:/sql:ro
      - ./postgres/migrate.sh:/scripts/migrate.sh:ro
      - ./trillian/storage.sql:/trillian/storage.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    <<: *core
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Tokens are issued for the public URL (the gateway serves the login pages on that origin);
      # services inside the network reach Keycloak as keycloak:8080.
      KC_HOSTNAME: ${PUBLIC_URL:-http://localhost:9080}
      # The admin console is not routed by the gateway; it stays on the private port.
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_CONSOLE_OUTPUT: json
      # Read by the realm import for the demo users' password.
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./demo/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; query the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  hasura:
    <<: *core
    image: hasura/graphql-engine:v2.50.3
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
      # Verify Keycloak tokens and map the tenant claim to the X-Hasura-Tenant-Id session variable.
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"type": "RS256",
        "jwk_url": "http://keycloak:8080/realms/ecotrace/protocol/openid-connect/certs",
        "issuer": "${PUBLIC_URL:-http://localhost:9080}/realms/ecotrace",
        "claims_map": {
        "x-hasura-allowed-roles": ["user"],
        "x-hasura-default-role": "user",
        "x-hasura-tenant-id": {"path": "$$.tenant_id"}}}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  nats:
    <<: *core
    image: nats:2.15.1
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--server_name", "ecotrace-nats"]
    volumes:
      - nats-data:/data

  seaweedfs:
    <<: *core
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Writes the S3 identity from the environment, then runs master, volume, filer and S3 gateway in one process.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"ecotrace","credentials":[{"accessKey":"%s","secretKey":"%s"}],
        "actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=256
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20

  clamav:
    <<: *core
    image: clamav/clamav:1.5.4
    volumes:
      # Signature database survives restarts, so only the first start downloads it (a few minutes).
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  document-intake:
    <<: *core
    build: ../../capabilities/document-intake
    image: ecotrace/document-intake:dev
    environment:
      # Requests run as intake_app (row-level security applies); migrations run as the owner.
      DATABASE_URL: postgres://intake_app:${INTAKE_DB_PASSWORD}@postgres:5432/ecotrace
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      JWKS_URL: http://keycloak:8080/realms/ecotrace/protocol/openid-connect/certs
      JWT_ISSUER: ${PUBLIC_URL:-http://localhost:9080}/realms/ecotrace
      TENANTS_DIR: /config/tenants
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      NATS_URL: nats://nats:4222
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # AI provider: gemini (default) or claude. Keys come from the shell (for example a Codespaces secret)
      # and are never written to a file in the repository.
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.6-flash,gemini-3.5-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-low}
    volumes:
      - ../../tenants:/config/tenants:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      clamav:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      nats:
        condition: service_started

  # Verifiable log (ADR-0001): append-only Merkle tree whose signed roots seal closed periods.
  trillian-log-server:
    <<: *core
    image: gcr.io/trillian-opensource-ci/log_server:v1.8.0
    command:
      - --storage_system=postgresql
      - --quota_system=postgresql
      - --postgresql_uri=postgresql:///trillian?host=postgres&user=trillian&password=${TRILLIAN_DB_PASSWORD}
      - --rpc_endpoint=0.0.0.0:8090
      - --http_endpoint=0.0.0.0:8091
      - --alsologtostderr
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  trillian-log-signer:
    <<: *core
    image: gcr.io/trillian-opensource-ci/log_signer:v1.8.0
    command:
      - --storage_system=postgresql
      - --quota_system=postgresql
      - --postgresql_uri=postgresql:///trillian?host=postgres&user=trillian&password=${TRILLIAN_DB_PASSWORD}
      - --force_master
      - --sequencer_interval=200ms
      - --rpc_endpoint=0.0.0.0:8090
      - --http_endpoint=0.0.0.0:8091
      - --alsologtostderr
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  ledger-sealer:
    <<: *core
    build: ../../apps/ledger-sealer
    image: ecotrace/ledger-sealer:dev
    environment:
      TRILLIAN_ADDR: trillian-log-server:8090
    depends_on:
      trillian-log-server:
        condition: service_started
      trillian-log-signer:
        condition: service_started

  # BPMN engine (ADR-0001). Process definitions come from the tenant config packs, deployed by dxctl.
  flowable:
    <<: *core
    image: flowable/flowable-rest:8.0.0
    environment:
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USER-ID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      FLOWABLE_REST_APP_CREATE-DEMO-DEFINITIONS: "false"
      JAVA_OPTS: -Xms256m -Xmx768m
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  workflow:
    <<: *core
    build: ../../capabilities/workflow-ui
    image: ecotrace/workflow:dev
    environment:
      FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      JWKS_URL: http://keycloak:8080/realms/ecotrace/protocol/openid-connect/certs
      JWT_ISSUER: ${PUBLIC_URL:-http://localhost:9080}/realms/ecotrace
      NATS_URL: nats://nats:4222
    depends_on:
      flowable:
        condition: service_started
      document-intake:
        condition: service_healthy

  purchase-approval:
    <<: *core
    build: ../../apps/purchase-approval
    image: ecotrace/purchase-approval:dev
    environment:
      DATABASE_URL: postgres://purchase_app:${PURCHASE_DB_PASSWORD}@postgres:5432/ecotrace
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      JWKS_URL: http://keycloak:8080/realms/ecotrace/protocol/openid-connect/certs
      JWT_ISSUER: ${PUBLIC_URL:-http://localhost:9080}/realms/ecotrace
      TENANTS_DIR: /config/tenants
      NATS_URL: nats://nats:4222
    volumes:
      - ../../tenants:/config/tenants:ro
    depends_on:
      document-intake:
        condition: service_healthy

  carbon-ledger:
    <<: *core
    build: ../../apps/carbon-ledger
    image: ecotrace/carbon-ledger:dev
    environment:
      DATABASE_URL: postgres://ledger_app:${LEDGER_DB_PASSWORD}@postgres:5432/ecotrace
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      JWKS_URL: http://keycloak:8080/realms/ecotrace/protocol/openid-connect/certs
      JWT_ISSUER: ${PUBLIC_URL:-http://localhost:9080}/realms/ecotrace
      TENANTS_DIR: /config/tenants
      NATS_URL: nats://nats:4222
      SEALER_URL: http://ledger-sealer:8080
    volumes:
      - ../../tenants:/config/tenants:ro
    depends_on:
      document-intake:
        condition: service_healthy
      ledger-sealer:
        condition: service_healthy

  demo-console:
    <<: *core
    image: nginx:1.30.6-alpine
    volumes:
      - ../../capabilities/demo-console/public:/usr/share/nginx/html:ro
      - ../../capabilities/demo-console/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../tenants/company-a-steel/seed/documents:/srv/samples/company-a-steel:ro
      - ../../tenants/company-b-logistics/seed/documents:/srv/samples/company-b-logistics:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # API reference page at /api-docs: one page for the OpenAPI documents of every service.
  # "Authorize" logs in through Keycloak with the browser client (Authorization Code + PKCE).
  api-docs:
    <<: *core
    image: swaggerapi/swagger-ui:v5.33.3
    environment:
      BASE_URL: /api-docs
      URLS: >-
        [{"url": "/intake/openapi.json", "name": "Document Intake"},
        {"url": "/ledger/openapi.json", "name": "Carbon Ledger"},
        {"url": "/workflow/openapi.json", "name": "Workflow"},
        {"url": "/purchase/openapi.json", "name": "Purchase Approval"}]
      OAUTH_CLIENT_ID: ecotrace-portal
      OAUTH_USE_PKCE: "true"
      PERSIST_AUTHORIZATION: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api-docs/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Tenant onboarding CLI; run with `make dxctl ARGS="tenant list"`. Not started by `make up`.
  dxctl:
    profiles: [tools]
    networks: [core]
    build: ../../tools/dxctl
    image: ecotrace/dxctl:dev
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ecotrace
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9080}
      FLOWABLE_URL: http://flowable:8080/flowable-rest/service
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      SCHEMA_DIR: /schemas
    volumes:
      - ../../tenants:/work/tenants:ro
      - ../../core/schemas:/schemas:ro

  apisix:
    <<: *core
    image: apache/apisix:3.19.0-debian
    environment:
      # Standalone mode: routes come from core/gateway/apisix/apisix.yaml, no etcd needed.
      APISIX_STAND_ALONE: "true"
    volumes:
      - ../../core/gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../../core/gateway/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "9080:9080"
    depends_on:
      hasura:
        condition: service_started
      document-intake:
        condition: service_started
      carbon-ledger:
        condition: service_started
      workflow:
        condition: service_started
      purchase-approval:
        condition: service_started
      demo-console:
        condition: service_started
      api-docs:
        condition: service_started

networks:
  core:

volumes:
  postgres-data:
  nats-data:
  seaweedfs-data:
  clamav-db:
