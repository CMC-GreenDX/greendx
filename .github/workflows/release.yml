name: release

# Pushing a tag such as v0.2.0 (or publishing a release for it in the GitHub UI) creates the release with:
# a .tar.gz source archive (the supported, open format), its SHA256SUMS, and notes generated by git-cliff.

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the source archive
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="greendx-${version}/" -o "greendx-${version}.tar.gz" "$TAG"
          sha256sum "greendx-${version}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          {
            echo "Install: download greendx-${TAG#v}.tar.gz, check it with SHA256SUMS, then follow docs/install.md."
            echo "GitHub also adds a zip of the source automatically; the .tar.gz is the supported format."
            npx --no-install git-cliff --latest --strip header
          } > notes.md

      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" greendx-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag --title "EcoTrace $TAG" --notes-file notes.md greendx-*.tar.gz SHA256SUMS
          fi
