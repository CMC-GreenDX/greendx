name: api-docs

# Publishes the API documentation to GitHub Pages: https://cmc-greendx.github.io/greendx/
# Pull requests only build the site, so a broken OpenAPI export shows up before the merge.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "capabilities/**"
      - "docs/api/**"
      - "tools/api-docs/**"
      - ".github/workflows/api-docs.yml"
  pull_request:
    paths:
      - "apps/**"
      - "capabilities/**"
      - "docs/api/**"
      - "tools/api-docs/**"
      - ".github/workflows/api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SWAGGER_UI_VERSION: 5.33.3

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the services' requirements
        run: |
          for service in capabilities/document-intake apps/carbon-ledger capabilities/workflow-ui apps/purchase-approval; do
            python -m pip install -r "$service/requirements.txt"
          done

      - name: Export the OpenAPI documents
        run: python tools/api-docs/export_openapi.py site/openapi

      - name: Add Swagger UI, the page and the Postman collection
        run: |
          cp tools/api-docs/site/index.html docs/api/ecotrace.postman_collection.json site/
          npm pack --silent "swagger-ui-dist@${SWAGGER_UI_VERSION}"
          tar -xzf "swagger-ui-dist-${SWAGGER_UI_VERSION}.tgz"
          mkdir site/swagger
          cp package/swagger-ui.css package/swagger-ui-bundle.js package/swagger-ui-standalone-preset.js package/LICENSE site/swagger/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
